name: FerreTracker Minero Diario

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 4 * * *' 

jobs:
  minar-datos:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y Ejecutar (Todo en backend)
        # Cambiar explícitamente al directorio backend para evitar problemas de path
        run: |
          cd construfacil-backend
          pwd  # Para depuración - mostrar directorio actual
          ls -la  # Para depuración - listar contenido
          
          # Verificar variables de entorno (solo mostrar primeros y últimos caracteres por seguridad)
          echo "DIRECT_URL está configurada: $${{ secrets.DIRECT_URL != '' }}"
          if [ -n "$DIRECT_URL" ]; then
            echo "DIRECT_URL longitud: ${#DIRECT_URL}"
            echo "DIRECT_URL comienza con: ${DIRECT_URL:0:3}..."
            echo "DIRECT_URL termina con: ...${DIRECT_URL: -3}"
          else
            echo "DIRECT_URL está vacía o no está configurada"
          fi
          
          npm install
          npx playwright install-deps
          npx playwright install chromium
          node src/jobs/dataMiner.js