name: FerreTraker Minero Diario

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 7 * * *' 

jobs:
  minar-datos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        # Buscamos el package.json dentro de cualquier carpeta llamada 'backend'
        run: |
          cd $(find . -name "backend" -type d | head -n 1)
          npm install

      - name: Instalar Playwright
        run: npx playwright install chromium --with-deps

      - name: Ejecutar Extracción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Este comando busca la carpeta backend, entra y ejecuta tu minero
        run: |
          cd $(find . -name "backend" -type d | head -n 1)
          node src/jobs/dataMiner.js