name: FerreTracker Minero Diario

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 7 * * *' 

jobs:
  minar-datos:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Silenciamos la advertencia de Node
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          # Buscamos la carpeta backend dinámicamente
          BACKEND_DIR=$(find . -name "backend" -type d | head -n 1)
          cd $BACKEND_DIR
          npm install

      - name: Instalar Playwright y dependencias de sistema
        run: |
          # Esto instala las librerías de Linux necesarias para correr Chrome
          npx playwright install-deps
          npx playwright install chromium

      - name: Instalar dependencias y ejecutar minero
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Encontramos la carpeta backend
          BACKEND_PATH=$(find . -name "backend" -type d | head -n 1)
          
          # npm --prefix busca el package.json en esa carpeta, sin necesidad de 'cd'
          npm install --prefix $BACKEND_PATH
          
          # Playwright necesita saber dónde instalar las cosas
          npx playwright install-deps
          npx playwright install chromium
          
          # Ejecutamos apuntando a la ruta absoluta
          node $BACKEND_PATH/src/jobs/dataMiner.js