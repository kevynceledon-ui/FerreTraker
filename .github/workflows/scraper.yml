name: FerreTracker Minero Diario

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 7 * * *' 

jobs:
  minar-datos:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y Ejecutar (Todo en backend)
        # ESTA ES LA MAGIA: Le dice a GitHub que asuma que la terminal 
        # está abierta directamente dentro de la carpeta backend
        working-directory: ./construfacil-backend
        run: |
          npm install
          npx playwright install-deps
          npx playwright install chromium
          node src/jobs/dataMiner.js